[project]
name = "miserable-stamp"
version = "0.2.0"
description = "Adds stable ids to StrictDoc documents, CML models and code markers for miserable."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-python==0.25.0",
]

[project.scripts]
miserable-stamp = "miserable_stamp.cli:main_entry"

[project.urls]
Homepage = "https://github.com/miserable-ai/miserable-stamp"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miserable_stamp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["miserable_stamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
filterwarnings = ["error"]
